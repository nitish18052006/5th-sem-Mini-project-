{% extends "base.html" %}

{% block title %}
Page Not Found | EcoGuardian
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center">

        <div class="display-1">
            🌍
        </div>

        <h1 class="fw-bold">
            404
        </h1>

        <h3>
            Page Not Found
        </h3>

        <p class="text-muted">
            The page you are looking for does not exist.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-success">

            Return Home

        </a>

    </div>

</div>

{% endblock %}
