{% extends "base.html" %}

{% block title %}
Server Error | EcoGuardian
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center">

        <div class="display-1">
            ⚠️
        </div>

        <h1 class="fw-bold">
            500
        </h1>

        <h3>
            Internal Server Error
        </h3>

        <p class="text-muted">
            Something went wrong while processing your request.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-success">

            Return Home

        </a>

    </div>

</div>

{% endblock %}
