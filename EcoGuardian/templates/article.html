{% extends "base.html" %}

{% block title %}
{{ article.title }} | EcoGuardian
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <a
                href="{{ url_for('awareness.awareness') }}"
                class="btn btn-outline-success mb-4">

                ← Back to Awareness

            </a>


            <article class="card shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <span class="badge bg-success mb-3">
                        {{ article.category }}
                    </span>

                    <h1 class="fw-bold">
                        {{ article.title }}
                    </h1>

                    <p class="lead text-muted">
                        {{ article.summary }}
                    </p>

                    <hr>

                    <div class="article-content">

                        {{ article.content }}

                    </div>

                </div>

            </article>

        </div>

    </div>

</div>

{% endblock %}
