{% extends "base.html" %}

{% block title %}
Register | EcoGuardian
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div class="feature-icon">
                            🌍
                        </div>

                        <h2 class="fw-bold">
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Join the EcoGuardian community
                        </p>

                    </div>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter your name"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password"
                                minlength="6"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Create Account

                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <p>
                            Already have an account?
                            <a href="{{ url_for('auth.login') }}">
                                Login
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
